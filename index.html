<title>English blog</title>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--lk-bg:#f2f2f7;--lk-card:#fff;--lk-fg:#000;--lk-sub:#6d6d72;--lk-line:#c6c6c8;--lk-tint:#ff2d55}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--lk-bg:#000;--lk-card:#1c1c1e;--lk-fg:#fff;--lk-sub:#98989f;--lk-line:#38383a;--lk-tint:#ff375f}}
body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--lk-bg);color:var(--lk-fg)}
img{max-width:100%}[hidden]{display:none!important}
#lock{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#lock form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;text-align:center}
#lock h1{font-size:28px;font-weight:700;margin:0;letter-spacing:-.02em}
#lock p{margin:0 0 8px;color:var(--lk-sub);font-size:15px}
#lock input{font:inherit;font-size:17px;height:50px;border-radius:12px;border:.5px solid var(--lk-line);background:var(--lk-card);color:var(--lk-fg);padding:0 16px;text-align:center;outline:none}
#lock input:focus{border-color:var(--lk-tint)}
#lock button{font:inherit;font-size:17px;font-weight:600;height:50px;border-radius:12px;border:0;background:var(--lk-tint);color:#fff;cursor:pointer}
#lockErr{color:var(--lk-tint);min-height:20px;font-size:14px}
</style>
</head>
<body>
<div id="lock" hidden>
  <form id="lockForm" autocomplete="off">
    <h1>English blog</h1>
    <p>Введи пароль один раз, телефон его запомнит.</p>
    <input id="lockPw" type="password" placeholder="Пароль" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Пароль">
    <button type="submit">Открыть</button>
    <div id="lockErr" role="alert"></div>
  </form>
</div>

  function bytes(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
  function hex(a){return Array.prototype.map.call(a,function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
  function unhex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
  function getKey(){try{return localStorage.getItem(KEYNAME)}catch(e){return null}}
  function setKey(v){try{localStorage.setItem(KEYNAME,v)}catch(e){}}
  function dropKey(){try{localStorage.removeItem(KEYNAME)}catch(e){}}
  function derive(pw){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits'])
      .then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',salt:bytes(SALT),iterations:ITER,hash:'SHA-256'},k,256)})
      .then(function(b){return new Uint8Array(b)});
  }
  function open(raw){
    return crypto.subtle.importKey('raw',raw,{name:'AES-CBC'},false,['decrypt'])
      .then(function(k){return crypto.subtle.decrypt({name:'AES-CBC',iv:bytes(IV)},k,bytes(DATA))})
      .then(function(buf){
        var t=new TextDecoder().decode(buf);
        if(t.slice(0,MARK.length)!==MARK) throw new Error('bad');
        return t.slice(MARK.length);
      });
  }
  function render(html){
    document.getElementById('lock').remove();
    var tpl=document.createElement('template'); tpl.innerHTML=html;
    var scripts=[]; tpl.content.querySelectorAll('script').forEach(function(s){scripts.push(s.textContent); s.remove()});
    document.body.appendChild(tpl.content);
    scripts.forEach(function(code){var s=document.createElement('script'); s.textContent=code; document.body.appendChild(s)});
  }
  function ask(){
    var lock=document.getElementById('lock'); lock.hidden=false;
    document.getElementById('lockForm').addEventListener('submit',function(e){
      e.preventDefault();
      var err=document.getElementById('lockErr'); err.textContent='';
      var pw=document.getElementById('lockPw').value.trim().toLowerCase();
      if(!pw) return;
      derive(pw).then(function(raw){return open(raw).then(function(html){setKey(hex(raw)); render(html)})})
        .catch(function(){err.textContent='Пароль не подошёл'});
    });
  }
  var saved=getKey();
  if(saved){ open(unhex(saved)).then(render).catch(function(){dropKey(); ask()}) } else ask();
})();
